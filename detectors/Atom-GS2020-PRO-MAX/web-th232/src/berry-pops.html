<div class="scrim" id="berry-scrim" hidden></div>
<div class="pop" id="berry-pop" hidden role="dialog" aria-modal="true" aria-labelledby="berry-popTitle"></div>

<template id="berry-t-method">
  <h2 id="berry-popTitle">Два метода на спектре черники</h2>

  <h3>Метод 1: МК-шаблоны полного распада</h3>
  <p>Три расчёта Geant4 в геометрии пробы: Cs-137 до Ba-137m; K-40; Sr-90 и Y-90, объединённые в отношении 1:1 в один β-шаблон.
  Смоделировано распадов: {{tpl_decays}}. Выход Iγ линии 662&nbsp;кэВ в шаблоне Cs-137 приведён к значению LNHB. Подгонка — тремя амплитудами по критерию A2
  (метод наименьших квадратов по нетто-спектру; вес канала учитывает дисперсию измерения и дисперсию шаблона); погрешность умножена на поправку Бирге, когда χ²/ν больше единицы.</p>

  <h3>Фон</h3>
  <p>Маринелли с дистиллированной водой, собственная шкала энергии; вычитается фиксированным коэффициентом — отношением живых времён —
  и не подгоняется (множитель при приведённом фоне в сводке зафиксирован и равен единице). В коэффициент входит поправка r(E) на ослабление внешнего фона пробой черники (плотность пробы меньше плотности воды), вычисленная в Geant4
  отдельно для пиков полного поглощения фона и для его континуума (внешнее поле). Примечание: функция r(E) была переопределена после первого расчёта, когда результат уже был известен;
  одним из оснований было качество подгонки, другим — осцилляции прежней r(E) между узлами сетки.</p>

  <h3>Слои на графике</h3>
  <p>Метод 1: Cs-137; K-40; «внешнее тормозное излучение β Sr-90+Y-90 (Geant4)» (вспомогательный параметр подгонки; активность Sr-90 по γ-спектру не определяется). Метод 2: линии Cs-137; линии K-40; внешнее тормозное излучение (β/e⁻) Cs-137 и K-40 отдельными слоями; то же β Sr-90+Y-90; фон.</p>

  <h3>Метод 2: функция полного поглощения (ПП) × библиотека линий</h3>
  <p>Функция ПП — эффективность регистрации в пике полного поглощения по откликам Geant4 на моноэнергетические γ-кванты в геометрии пробы. Библиотека — {{berry_m2_nlines}} линий двух нуклидов: у Cs-137 γ-линия 661,7&nbsp;кэВ и K-рентгеновские линии Ba, у K-40 γ-линия 1460,8&nbsp;кэВ и рентгеновские линии Ar
  (из них рентгеновских — {{berry_m2_nxray}}; рентгеновское излучение учитывается всегда). Для каждой линии прямой расчёт Geant4 для моноэнергетического объёмного источника в той же пробе
  даёт полный спектр энерговыделения (узлов сетки: {{berry_m2_nodes}}); он уширяется по той же зависимости ПШПВ(E) и умножается на выход линии.
  К откликам с той же амплитудой добавлено внешнее тормозное излучение β-электронов и электронов конверсии: отдельными слоями для Cs-137 и K-40.
  Sr-90+Y-90 входит тем же β-шаблоном, что и в методе 1, как вспомогательный параметр подгонки. Внутреннее тормозное излучение в расчёт не входит.
  Подгонка — тремя амплитудами в том же окне, что и в методе 1; погрешность умножена на поправку Бирге. K-рентгеновское излучение Ar до кристалла не доходит.
  Итог: Cs-137 {{berry_m2_cs_a}}, K-40 {{berry_m2_k_a}}, χ²/ν = {{berry_m2_chi2}}.</p>

  <h3>Общие элементы всех шаблонов</h3>
  <p>ПШПВ(E) из набора данных детектора (значения в опорных точках по опорному спектру тория, интерполяция в логарифмах) с ядром разброса усиления: w = {{berry_gain_w}} — доля событий с дополнительным разбросом усиления, s = {{berry_gain_s}} — его относительное СКО (в долях энергии события);
  параметры выбраны перебором вариантов по форме пиков на спектре тория-232 и применены ко всем спектрам GS2020; собственная шкала энергии; геометрия.</p>
</template>

<template id="berry-t-passport">
  <h2 id="berry-popTitle">Проба: сушёная черника</h2>
  <dl class="specs">
    <div><dt>Проба</dt><dd>сушёная черника, активность неизвестна</dd></div>
    <div><dt>Масса</dt><dd>{{berry_mass}}</dd></div>
    <div><dt>Объём в сосуде</dt><dd>1&nbsp;л (уровень {{berry_level}} от среза)</dd></div>
    <div><dt>Плотность и состав в модели</dt><dd>ρ&nbsp;=&nbsp;{{berry_rho}}; {{matrix_comp}} по массе</dd></div>
    <div><dt>Измерение</dt><dd>{{berry_live_h}} живого времени, {{berry_dates}}</dd></div>
    <div><dt>Опорное значение</dt><dd>Бета-1С, СпектраЛайн: Cs-137 {{berry_sl_cs}} на дату измерения ({{berry_sl_cs24}} на 01.10.2024),
    K-40 {{berry_sl_k}}; другая проба и другой прибор</dd></div>
  </dl>
  <p>Аттестованной активности нет. Cs-137 — метод 1 (метод 2: {{berry_m2_cs_a}}), систематическая погрешность около {{berry_cs_sys}}. K-40 — метод 1 предварительный;
  погрешность вычитания фона {{berry_k_noise}}, систематическая погрешность {{berry_k_sys}}.
  В модели проба содержит калий {{berry_kfrac_model}} по массе, результат подгонки соответствует примерно {{berry_kfrac_found}};
  влияние на самопоглощение не оценивалось (ожидается малым).</p>
</template>

<template id="berry-t-model">
  <h2 id="berry-popTitle">Модель прибора, сосуда и пробы</h2>
  <p>Прибор — та же Geant4-модель, что у тория: кристалл NaI(Tl) Capescint Ø51×51&nbsp;мм,
  корпус по STEP-чертежу прибора. Сосуд — Маринелли&nbsp;2 (не тот, что для тория), по измерениям от 29.09.2026: сосуд объёмом 1&nbsp;л с коническим
  колодцем. Размеры: диаметр внутренней полости колодца Ø79 → Ø77&nbsp;мм, наружной стенки Ø85 → Ø83&nbsp;мм (от дна сосуда к дну колодца), глубина колодца 57&nbsp;мм, полость коническая, от Ø136&nbsp;мм
  у дна до Ø141&nbsp;мм у верха, внутренняя высота 103&nbsp;мм, пластик 3&nbsp;мм везде, включая крышку.
  Прибор полностью вставлен в колодец (корпус упирается в дно колодца). Проба — сушёная черника
  ({{matrix_comp}} по массе) с плотностью {{berry_rho}} и высотой заполнения, соответствующей объёму
  1&nbsp;л. Физика — Geant4, физический список EmStandard_option4, порог образования 0,05&nbsp;мм, девозбуждение атома
  (атомная релаксация) включено.</p>
  <p>Это первая проба с неизвестной активностью после опорного тория и проверки KCl;
  набор данных детектора (кривая эффективности и матрица отклика — расчёт Geant4, ширина пика — по опорному спектру тория) применяется без повторной подгонки.</p>
</template>
