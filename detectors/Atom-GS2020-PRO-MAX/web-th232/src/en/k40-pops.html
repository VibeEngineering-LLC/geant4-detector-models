<template id="k40-t-method">
  <h2 id="k40-popTitle">Two methods on the KCl spectrum</h2>

  <h3>Method 1: Monte Carlo template of the full K-40 decay</h3>
  <p>The template is a Geant4 calculation for a source of K-40 nuclear decays in the KCl sample volume in a
  Marinelli beaker ({{tpl_decays}} simulated decays): it includes all decay products generated by
  Geant4, namely the 1460.8&nbsp;keV γ ray and the β particles transported in the material. Internal bremsstrahlung
  (IB) is not generated by Geant4 and is <b>not included</b> in the K-40 calculation: for the third-forbidden unique transition, neither a measurement
  nor a verified formula exists, so its contribution has not been confirmed quantitatively. The fraction of β⁻ decays in the Geant4 template (89.14&nbsp;%) is scaled to the LNHB-DDEP 2025 value (89.56&nbsp;%)
  by adding the Method 2 β template for the missing fraction. The template is broadened according to the
  FWHM(E) function (values at the reference points, log–log interpolation) and fitted with a single amplitude using the A2 criterion (least-squares fit to the net spectrum; the channel weight accounts for the measurement variance and the template variance);
  the uncertainty is multiplied by the Birge ratio correction √(χ²/ν) when χ²/ν exceeds one.</p>

  <h3>Method 2: full-energy-peak (FEP) efficiency function × line</h3>
  <p>The FEP efficiency function is the detection efficiency in the full-energy peak obtained from Geant4 responses to monoenergetic γ rays in the sample geometry. A direct Geant4 calculation is performed for a monoenergetic volume source of 1460.8&nbsp;keV in the same sample;
  its full energy-deposition spectrum, broadened with the same FWHM(E) function, is multiplied by the γ-ray emission probability
  ({{k40_ig}}&nbsp;%, LNHB-DDEP 2025). A β template is added with the same amplitude — a K-40 decay calculation
  in which primary decay photons are removed at the moment of their creation, while electrons are fully transported (their bremsstrahlung in the sample
  and the beaker). Internal bremsstrahlung (IB) is not included in the calculation, as in Method 1. The fit uses a single amplitude, as
  in Method 1.</p>

  <h3>Background</h3>
  <p>The background is a measurement of the same Marinelli beaker filled with distilled water, using its own energy calibration;
  it is subtracted with a fixed coefficient — the ratio of live times — and is not fitted (the multiplier for the scaled background in the summary is fixed at one).</p>

  <h3>Common elements of both methods</h3>
  <p>The FWHM(E) function; the background; the energy scale; the geometry of the spectrometer, the beaker, and the sample — one model for all
  calculations.</p>
</template>

<template id="k40-t-passport">
  <h2 id="k40-popTitle">KCl sample and expected activity</h2>
  <dl class="specs">
    <div><dt>Nuclide</dt><dd>K-40 of natural potassium</dd></div>
    <div><dt>Reagent</dt><dd>KCl, “pure” grade (Russian designation “ch.”, GOST 4234-77)</dd></div>
    <div><dt>Mass</dt><dd>{{mass}}</dd></div>
    <div><dt>Volume in the beaker</dt><dd>{{k40_vol}}</dd></div>
    <div><dt>Density and composition in the model</dt><dd>ρ&nbsp;=&nbsp;{{matrix_rho}}&nbsp;g/cm³; {{matrix_comp}} by mass</dd></div>
    <div><dt>Activity concentration</dt><dd>{{aksp}} (relative uncertainty {{aksp_unc}})</dd></div>
    <div><dt>Expected activity</dt><dd>{{apass}} {{apass_dev}}</dd></div>
  </dl>
  <p>Expected activity = mass × fraction of potassium in KCl ({{k40_kfrac}}) × specific activity
  of natural potassium ({{k40_spec}}); K-40 abundance and half-life are from LNHB-DDEP 2025
  (K-40 radionuclide table, rev. 31.05.2025). The uncertainty {{aksp_unc}} combines the uncertainties of the K-40 abundance,
  the half-life, and the reagent purity tolerance per GOST 4234-77 (treated as a uniform distribution).
  The central value assumes a perfectly pure reagent; the uncertainty of the weighing (balance) is unknown and not included.</p>
</template>

<template id="k40-t-model">
  <h2 id="k40-popTitle">Model of the spectrometer, beaker, and sample</h2>
  <p>The spectrometer is the same Geant4 model as for thorium: NaI(Tl) Capescint crystal Ø51×51&nbsp;mm,
  housing per the spectrometer STEP drawing. The beaker is Marinelli&nbsp;2 (not the one used for thorium), based on measurements from 29.09.2026: a 1&nbsp;L beaker with a conical
  re-entrant well. Dimensions: inner cavity of the well Ø79 → Ø77&nbsp;mm, outer wall Ø85 → Ø83&nbsp;mm (from the beaker bottom to the well bottom), well depth 57&nbsp;mm, conical cavity, from Ø136&nbsp;mm
  at the bottom to Ø141&nbsp;mm at the top, inside height 103&nbsp;mm, plastic 3&nbsp;mm thick everywhere, including the lid.
  The spectrometer is fully inserted into the re-entrant well (the housing rests on the well bottom). The sample is KCl
  ({{matrix_comp}} by mass) with a density of {{matrix_rho}}&nbsp;g/cm³ and a fill height corresponding to the volume
  {{k40_vol}}. Physics — Geant4, physics list EmStandard_option4, production cut 0.05&nbsp;mm, atomic de-excitation
  (atomic relaxation) enabled.</p>
  <p>The K-40 activity is known from the mass, without certification; therefore, this measurement checks the model as a whole — the geometry, the detector response, and the detection efficiency (the energy scale is determined separately) — for a sample of a different composition and density than that of thorium.</p>
</template>
