<!-- #GS-26: всплывающие окна панели K-40 (scripts/g1s-k40.js: openPop → k40-pop, k40-scrim, шаблоны k40-t-*) -->
<div class="scrim" id="k40-scrim" hidden></div>
<div class="pop" id="k40-pop" hidden role="dialog" aria-modal="true" aria-labelledby="k40-popTitle"></div>

<template id="k40-t-method">
  <h2 id="k40-popTitle">Два метода на спектре KCl</h2>

  <h3>Метод 1: МК-шаблон полного распада K-40</h3>
  <p>Шаблон — расчёт Geant4 для источника распадов ядер K-40 в объёме пробы KCl в сосуде
  Маринелли (смоделировано {{tpl_decays}} распадов): в него входят все продукты распада, которые генерирует
  Geant4, — γ-квант 1460,8&nbsp;кэВ и β-частицы, переносимые в веществе. Внутреннее тормозное
  излучение (IB) Geant4 не генерирует, и в расчёт K-40 оно <b>не входит</b>: для третьего уникального запрета нет ни измерения,
  ни проверенной формулы, поэтому его вклад не подтверждён числом. Доля β⁻-распадов в шаблоне Geant4 (89,14&nbsp;%) приведена к значению LNHB-DDEP 2025 (89,56&nbsp;%)
  добавлением β-шаблона метода 2 в недостающей доле. Шаблон уширяется по зависимости
  ПШПВ(E) (значения в опорных точках, интерполяция в логарифмах) и подгоняется одной амплитудой по критерию A2 (метод наименьших квадратов по нетто-спектру; вес канала учитывает дисперсию измерения и дисперсию шаблона);
  погрешность умножена на поправку Бирге √(χ²/ν), когда χ²/ν больше единицы.</p>

  <h3>Метод 2: функция полного поглощения (ПП) × линия</h3>
  <p>Функция ПП — эффективность регистрации в пике полного поглощения по откликам Geant4 на моноэнергетические γ-кванты в геометрии пробы. Прямой расчёт Geant4 для моноэнергетического объёмного источника 1460,8&nbsp;кэВ в той же пробе;
  его полный спектр энерговыделения, уширенный по той же зависимости ПШПВ(E), умножается на выход линии
  ({{k40_ig}}&nbsp;%, LNHB-DDEP 2025). К нему с той же амплитудой добавлен β-шаблон — расчёт распада K-40,
  в котором первичные фотоны распада удаляются в момент возникновения, а электроны переносятся полностью (их тормозное излучение в пробе
  и сосуде). Внутреннее тормозное излучение (IB) в расчёт не входит, как и в методе 1. Подгонка — одной амплитудой, как
  в методе 1.</p>

  <h3>Фон</h3>
  <p>Фон — измерение того же сосуда Маринелли с дистиллированной водой с собственной шкалой энергии;
  вычитается фиксированным коэффициентом — отношением живых времён — и не подгоняется (множитель при приведённом фоне в сводке зафиксирован и равен единице).</p>

  <h3>Общие элементы обоих методов</h3>
  <p>Зависимость ПШПВ(E); фон; шкала энергии; геометрия прибора, сосуда и пробы — одна модель для всех
  расчётов.</p>
</template>

<template id="k40-t-passport">
  <h2 id="k40-popTitle">Проба KCl и ожидаемая активность</h2>
  <dl class="specs">
    <div><dt>Нуклид</dt><dd>K-40 природного калия</dd></div>
    <div><dt>Реактив</dt><dd>KCl квалификации «чистый» («ч.», ГОСТ 4234-77)</dd></div>
    <div><dt>Масса</dt><dd>{{mass}}</dd></div>
    <div><dt>Объём в сосуде</dt><dd>{{k40_vol}}</dd></div>
    <div><dt>Плотность и состав в модели</dt><dd>ρ&nbsp;=&nbsp;{{matrix_rho}}&nbsp;г/см³; {{matrix_comp}} по массе</dd></div>
    <div><dt>Удельная активность</dt><dd>{{aksp}} (относительная неопределённость {{aksp_unc}})</dd></div>
    <div><dt>Ожидаемая активность</dt><dd>{{apass}} {{apass_dev}}</dd></div>
  </dl>
  <p>Ожидаемая активность = масса × доля калия в KCl ({{k40_kfrac}}) × удельная активность
  природного калия ({{k40_spec}}); распространённость K-40 и период полураспада — LNHB-DDEP 2025
  (таблица радионуклидов K-40, ред. 31.05.2025). Неопределённость {{aksp_unc}} складывается из неопределённостей распространённости K-40,
  периода полураспада и допуска чистоты реактива по ГОСТ 4234-77 (как равномерное распределение).
  Чистота в центральном значении принята полной; погрешность весов неизвестна и не включена.</p>
</template>

<template id="k40-t-model">
  <h2 id="k40-popTitle">Модель прибора, сосуда и пробы</h2>
  <p>Прибор — та же Geant4-модель, что у тория: кристалл NaI(Tl) Capescint Ø51×51&nbsp;мм,
  корпус по STEP-чертежу прибора. Сосуд — Маринелли&nbsp;2 (не тот, что для тория), по измерениям от 29.09.2026: сосуд объёмом 1&nbsp;л с коническим
  колодцем. Размеры: диаметр внутренней полости колодца Ø79 → Ø77&nbsp;мм, наружной стенки Ø85 → Ø83&nbsp;мм (от дна сосуда к дну колодца), глубина колодца 57&nbsp;мм, полость коническая, от Ø136&nbsp;мм
  у дна до Ø141&nbsp;мм у верха, внутренняя высота 103&nbsp;мм, пластик 3&nbsp;мм везде, включая крышку.
  Прибор полностью вставлен в колодец (корпус упирается в дно колодца). Проба — KCl
  ({{matrix_comp}} по массе) с плотностью {{matrix_rho}}&nbsp;г/см³ и высотой заполнения, соответствующей объёму
  {{k40_vol}}. Физика — Geant4, физический список EmStandard_option4, порог образования 0,05&nbsp;мм, девозбуждение атома
  (атомная релаксация) включено.</p>
  <p>Активность K-40 известна по массе, без аттестации, поэтому это измерение проверяет модель
  в целом — геометрию, отклик детектора и эффективность регистрации (шкала энергии определяется отдельно) — на пробе другого состава и плотности, чем у тория.</p>
</template>
