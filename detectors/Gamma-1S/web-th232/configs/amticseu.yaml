# Конфиг источника Mix AmTiCsEu для конвейера Гамма-1С (Тест 3 скилла
# geant4-spectrum-pipeline, 11.08.2026, задание оператора).
#
# ОТЛИЧИЕ ОТ Th-232/Ra-226: это НЕ цепочка векового равновесия, а смесь
# ЧЕТЫРЁХ НЕЗАВИСИМЫХ радионуклидов (искусственный калибровочный источник
# «№SRC-04», паспорт LSRM). У каждого — своя, физически не связанная с
# остальными активность. Поэтому здесь 4 НЕЗАВИСИМЫЕ свободные амплитуды
# (Method 1: одна на группу, не одна на весь набор), а не одна общая, как
# в decay_th232_isotopes.mac/decay_ra226_isotopes.mac. Секция nuclides
# ниже перечисляет 4 ГРУППЫ, не 4 звена одной цепочки; поле `group` у
# каждого нуклида — идентификатор независимой амплитуды.
#
# Источник (см. ra226-remarks.md-аналог, ведётся в amticseu-remarks.md):
#   Спектр: raw_lsrm/.../Поверка 2016/Маринелли/Смесь_AmTiCsEu_Маринелли.spe
#   Фон:    raw_lsrm/.../Поверка 2016/Фон вода/фон вода_13.spe (индекс _13,
#           ДРУГОЙ, чем у Ra-226 _14 -- та же серия "Фон вода", другая запись).
#   Матрица: risn379 (G1SDetector.cc, состав по MATERIAL этого САМОГО
#            .spe -- H 4,30 C 33,03 N 1,20 O 34,84 Na 4,10 Mg 2,20 Ca 20,33 %,
#            ро=1,0). Совпадает БУКВАЛЬНО (проверено 11.08.2026) с матрицей,
#            уже закоммиченной в детектор 28.07.2026 (задолго до этого теста,
#            для более раннего проекта общих кривых Гамма-1С) -- пересборка
#            g1s.exe не требуется, аргумент "risn379" уже поддержан.
#
# Валидация входов (11.08.2026, до конвейера, см. геant4-spectrum-pipeline
# SKILL.md §"Валидация входов"):
#   Файл: TLIVE/TREAL дают мёртвое время 0,31 % (MIX) и 0,04 % (BG) --
#     низкая загрузка, тот же режим, что у Th-232/Ra-226 (случайное
#     суммирование не корректируется, обоснование то же).
#   Шкала: ENERGY=2,-17.86494,2.945642,6.04871E-05 (квадратичная, штатный
#     артефакт -- каналы 0-6 дают E<0, calibration_drift_left=True в
#     lsrm_spe.py, КОСМЕТИКА: реальные пики начинаются с канала ~24).
#     На ЧИСТЫХ изолированных линиях (Eu-152 344,28 / аннигиляция 511 /
#     Cs-137 661,657 / Eu-152 964,08) отклонение вендорского peak-fit от
#     справочной энергии -- в пределах ±1,1 кэВ (argmax-проверка + прямое
#     чтение lsrm_peaks_table, PYTHONPATH=SPECTRAVIBE_ROOT/scripts,
#     gamma.io.lsrm_spe.read_lsrm_spe). НЕ подтверждён сдвиг "657 вместо
#     661,7", упомянутый в analysis/mix_unfold.py (тот докстринг, видимо,
#     описывает ДРУГУЮ запись комплекта -- Дента/Петри, не эту Маринелли);
#     локальная поправка шкалы для ЭТОЙ записи не нужна.
#   Паспорт: искусственный калибровочный источник (не природный ряд) --
#     методика аттестации не требует отдельной проверки, активность задана
#     прямо изготовителем на 31-05-2002 для каждого из 4 нуклидов отдельно
#     (заметки COMMENT= в .spe, 4 строки, см. passport ниже).
#   Пересечение с более ранним проектом: тот же физический источник уже
#     фигурирует в analysis/{kit_mixture,mix_unfold,resolve_tension}.py и
#     drivers/run_mix_decay.py (проект "Gamma-1S общие кривые", 28-31.07.2026,
#     docs/gamma-1s/) -- СТАРАЯ, отдельная методика (полноспектральная
#     подгонка по кривым эффективности, без деления на метод 1/метод 2 и
#     без LNHB-сверки библиотеки). Этот конфиг -- НОВЫЙ, независимый прогон
#     по методике geant4-spectrum-pipeline (Th-232/Ra-226); числа старого
#     проекта (например, Cs-137 1519 расч. против 1600 Бк/кг паспорт из
#     докстринга resolve_tension.py) -- ориентир для сверки порядка
#     величины, не вход конвейера.

source:
  id: amticseu
  measured_format: lsrm_spe
  measured_xml_rel: "N/A_lsrm_spe_used_instead"
  measured_sample_spe_rel: raw_lsrm/Work/BG/Gamma-1S/Spe - поверки/Поверка 2016/Маринелли/Смесь_AmTiCsEu_Маринелли.spe
  measured_background_spe_env: G4MODELS_AMTICSEU_BG_SPE
  chain_template_csv: "N/A_independent_groups_not_a_chain"

# Паспорт -- ЧЕТЫРЕ независимых записи, одна на группу. bq_per_kg -- НА
# passport_date (31-05-2002), decay-корректированное значение на
# measured_date (30-05-2016, MEASBEGIN спектра) считает движок сам из
# half_life_years + days_pass_to_meas (5113 сут = 13,9986 года, юлианский
# год 365,25 сут). Период полураспада -- IAEA Live Chart of Nuclides
# (decay_rads, curl, ✅, дописано в sci-search-corpus 11.08.2026):
#   Am-241  432,6(6) лет   (родитель, decay=A, 100%)
#   Ti-44   59,1(3) лет    (родитель, decay=EC, 100%; дочерний Sc-44,
#                           T1/2=4,042 ч -- секундная шкала против 14 лет
#                           эксплуатации, полное вековое равновесие)
#   Cs-137  30,08(9) лет   (уже в корпусе с 29.07.2026)
#   Eu-152  13,517(9) лет  (ОСНОВНОЕ состояние; не путать с изомером
#                           152mEu, T1/2=9,3116 ч)
passport:
  mass_g: 1000.0
  mass_unc_g: 10.0
  passport_date: "2002-05-31"
  measured_date: "2016-05-30"
  days_pass_to_meas: 5113
  # bq_per_kg/unc_pct/half_life_years на ЭТОМ уровне -- НЕ используются
  # export_amticseu_data.py (он читает passport.components поштучно),
  # заполнены значением Am241 ТОЛЬКО ради обратной совместимости с
  # export_data.py, который на уровне модуля безусловно парсит
  # _CFG["passport"]["bq_per_kg"] и т.д. в PASSPORT_BQ_KG/... (общий
  # движок, th232.yaml/ra226.yaml несут один нуклид/цепочку -- нашей
  # схеме с 4 группами эти константы не нужны, но модуль падает при
  # импорте без них).
  bq_per_kg: 4200.0
  unc_pct: 10.0
  half_life_years: 432.6
  components:
    - key: Am241
      bq_per_kg: 4200.0
      unc_pct: 10.0
      half_life_years: 432.6
    - key: Ti44chain
      bq_per_kg: 2130.0
      unc_pct: 5.0
      half_life_years: 59.1
    - key: Cs137chain
      bq_per_kg: 2210.0
      unc_pct: 5.0
      half_life_years: 30.08
    - key: Eu152
      bq_per_kg: 4150.0
      unc_pct: 5.0
      half_life_years: 13.517

# nuclides -- 4 НЕЗАВИСИМЫЕ группы (не звенья одной цепочки). group == key
# здесь тождественно (каждая группа -- один Geant4-прогон, см. geant4.
# isotope_runs ниже); поле оставлено отдельным для читаемости движка.
nuclides:
  - key: Am241
    group: Am241
    label_ru: Am-241
    label_en: Am-241
    color: "#8a4b1f"
    br: 1.0
    note_ru: "α; γ 59,541 кэВ (35,9%) -- главная линия; 26,34 кэВ (2,27%) ниже практического порога NaI"
  - key: Ti44chain
    group: Ti44chain
    label_ru: Ti-44 → Sc-44
    label_en: Ti-44 → Sc-44
    color: "#2c6e5a"
    br: 1.0
    note_ru: "EC (100%); прогон включает ОБА звена (nucleusLimits Z 20-22): Ti-44 γ 67,868/78,323 кэВ и Sc-44 γ 1157,02 кэВ + β⁺ → 511 кэВ (истинное совпадение 511+1157 -- физически внутри одного МК-прогона, F_B не нужен)"
  - key: Cs137chain
    group: Cs137chain
    label_ru: Cs-137 → Ba-137m
    label_en: Cs-137 → Ba-137m
    color: "#1f5c8a"
    br: 0.9457
    note_ru: "β⁻; линия 661,657 кэВ испускается ИЗОМЕРОМ Ba-137m (E*=661,659 кэВ), не самим Cs-137 -- прогон спавнит Ba-137m напрямую (/gps/ion 56 137 0 661.659), br=0,9457 -- доля распадов Cs-137, заселяющая метастабильный уровень. ✅ ПРЯМАЯ цитата LNHB (Cs-137_tables.pdf, §2.2 Gamma Transitions and ICC, Pγ+ce, личная перепроверка 11.08.2026): «γ2,0(Ba) 661,657(3) ... 94,57(26)»; независимо совпадает с расчётом из IAEA decay_rads (I_gamma/(1/(1+CC))=85,1%/(1/1,1124)=94,67%) с точностью 0,10% отн."
  - key: Eu152
    group: Eu152
    label_ru: Eu-152
    label_en: Eu-152
    color: "#7a1f6b"
    br: 1.0
    note_ru: "EC+β⁺ (72,08%) → Sm-152* и β⁻ (27,92%) → Gd-152*; богатейший каскад набора (учебный пример TCS вместе с Co-60/Na-22, LSRM МАГАТЭ-тест) -- F_B/TCS обязателен для метода 2, метод 1 считает суммирование физически"

fit:
  e_lo_kev: 40.0
  e_hi_kev: 1500.0

# library.lines -- ✅ ПРЯМОЕ чтение IAEA Live Chart of Nuclides (curl,
# nds.iaea.org/relnsd/v1/data?fields=decay_rads&rad_types=g, 11.08.2026),
# не пересказ и не память: 241am/44ti/44sc/137cs/152eu, дословные поля
# intensity/energy CSV. i_pct -- ПЕРВИЧНАЯ интенсивность на распад
# соответствующего эмиттера (Am-241 на распад Am241; Ti-44/Sc-44 на
# распад Ti44/Sc44 -- секулярное равновесие внутри группы Ti44chain
# делает их численно эквивалентными активности Ti-44; Cs-137 на распад
# Cs-137, УЖЕ включает и заселение Ba-137m (94,67%), и внутреннюю
# конверсию -- отдельно не домножать). LNHB-сверка ✅ ЗАВЕРШЕНА 11.08.2026:
# 20 строк сверены построчно с lnhb.fr/nuclides (curl+pymupdf, дословные
# цитаты), макс. расхождение 1,94% отн. (Eu-152 1112,076 кэВ). Личная
# перепроверка актора (2 контрольные точки прямым чтением PDF -- Cs-137
# 661,657 и Eu-152 1112,076) подтвердила цитаты субагента; попутно
# поймана своя ошибка (перепутана секция «5.2 Gamma Emissions», чистый
# выход фотона, с секцией «2.2 Gamma Transitions and ICC», Pγ+ce =
# фотон+конверсия -- разные величины на одной энергии, ловушка PDF-таблиц
# LNHB). Периоды полураспада: Am-241 Δ=0%, Cs-137 Δ=0,21%, Eu-152
# Δ=0,04%, Ti-44 Δ=1,5% (59,1 наши vs 60,0(11) LNHB -- совместимо в
# пределах погрешности).
library:
  intensity_threshold_pct: 1.3
  lines:
    - {e_kev: 59.541,  i_pct: 35.9,    nuclide: Am241, note: "главная линия Am-241"}
    - {e_kev: 67.868,  i_pct: 93.0,    nuclide: Ti44chain, note: "Ti-44, сильно блендирована с Am-241 59,5 и К-рентгеном Pb защиты"}
    - {e_kev: 78.323,  i_pct: 96.8,    nuclide: Ti44chain, note: "Ti-44, та же блендированная область"}
    - {e_kev: 121.7817,i_pct: 28.53,   nuclide: Eu152, note: "главная линия Eu-152"}
    - {e_kev: 244.6974,i_pct: 7.55,    nuclide: Eu152, note: ""}
    - {e_kev: 344.2785,i_pct: 26.59,   nuclide: Eu152, note: "вторая по силе линия Eu-152"}
    - {e_kev: 411.1165,i_pct: 2.237,   nuclide: Eu152, note: ""}
    - {e_kev: 443.9606,i_pct: 2.827,   nuclide: Eu152, note: ""}
    - {e_kev: 511.0,   i_pct: 188.556, nuclide: Ti44chain, note: "аннигиляция позитрона Sc-44 (IAEA 44sc decay_rads, energy=511, intensity=188,556% -- т.е. β⁺-branching 94,278%×2 квантов на распад Sc-44); распадов на порядок больше 100% -- ожидаемо для аннигиляционной пары"}
    - {e_kev: 661.657, i_pct: 85.1,    nuclide: Cs137chain, note: "главная линия набора, изомер Ba-137m"}
    - {e_kev: 778.9045,i_pct: 12.93,   nuclide: Eu152, note: ""}
    - {e_kev: 867.38,  i_pct: 4.23,    nuclide: Eu152, note: ""}
    - {e_kev: 964.057, i_pct: 14.51,   nuclide: Eu152, note: ""}
    - {e_kev: 1085.837,i_pct: 10.11,   nuclide: Eu152, note: ""}
    - {e_kev: 1089.737,i_pct: 1.734,   nuclide: Eu152, note: "близко к 1085,837 -- бленд на NaI"}
    - {e_kev: 1112.076,i_pct: 13.67,   nuclide: Eu152, note: ""}
    - {e_kev: 1157.022,i_pct: 99.8867, nuclide: Ti44chain, note: "главная линия Sc-44 (дочь Ti-44)"}
    - {e_kev: 1212.948,i_pct: 1.415,   nuclide: Eu152, note: "у порога библиотеки"}
    - {e_kev: 1299.142,i_pct: 1.633,   nuclide: Eu152, note: ""}
    - {e_kev: 1408.013,i_pct: 20.87,   nuclide: Eu152, note: "третья по силе линия Eu-152"}

# sum_peaks -- перебор tools/enumerate_sum_peaks.py по data/ensdf_amticseu_
# chain_lines.csv + data/conversion_coeff_amticseu.csv (11.08.2026, min-score
# 0.3). Приняты пары с ПОЛНЫМ CC (score>=1.5, тот же порядок величины
# отсечки, что у Th-232/Ra-226). Три кандидата с cc_incomplete НЕ приняты
# (443,961+964,057; 443,961+1085,837; 295,939+1112,076 -- все через уровень
# 1529,802/1085,841, где хотя бы один исходящий переход не нашёл CC в
# выгрузке) -- решение по ним оставлено оператору, как пара 241,995+53,226
# у Ra-226.
# ⚠️ ВАЖНО для метода 2: ДВЕ пары дают сумму, почти точно совпадающую с
# ОТДЕЛЬНОЙ прямой линией библиотеки того же нуклида -- 964,057+121,782=
# 1085,839 (реальная линия 1085,837) и 867,380+244,697=1112,077 (реальная
# линия 1112,076). Это не ошибка переписи: уровень 1085,841 кэВ каскадно
# питается ЧЕРЕЗ уровень 121,782, и оба вклада (прямой переход и сумма
# каскада) физически ложатся в ОДИН канал -- NNLS складывает оба
# соответствующих столбца в подгонке корректно, отдельного вычета не
# требуется.
sum_peaks:
  - {e1_kev: 78.323, e2_kev: 67.868, nuclide: Ti44chain, i1_pct: 96.8, i2_pct: 93.0, note: "уровень 67,868 кэВ; главный (и практически единственный) каскад Ti-44, score=89,25 -- доминирует в спектре как сумма 146,19 кэВ"}
  - {e1_kev: 778.904, e2_kev: 344.279, nuclide: Eu152, i1_pct: 12.93, i2_pct: 26.59, note: "уровень 344,279 кэВ; классическая пара Eu-152 (сумма 1123,18 кэВ), score=12,44"}
  - {e1_kev: 1408.013, e2_kev: 121.782, nuclide: Eu152, i1_pct: 20.87, i2_pct: 28.53, note: "уровень 121,782 кэВ; сумма 1529,80 кэВ, score=9,68"}
  - {e1_kev: 964.057, e2_kev: 121.782, nuclide: Eu152, i1_pct: 14.51, i2_pct: 28.53, note: "уровень 121,782 кэВ; сумма 1085,84 кэВ СОВПАДАЕТ с прямой линией 1085,837 -- см. примечание выше; score=6,73"}
  - {e1_kev: 1112.076, e2_kev: 121.782, nuclide: Eu152, i1_pct: 13.67, i2_pct: 28.53, note: "уровень 121,782 кэВ; сумма 1233,86 кэВ, score=6,34"}
  - {e1_kev: 867.380, e2_kev: 244.697, nuclide: Eu152, i1_pct: 4.23, i2_pct: 7.55, note: "уровень 366,479 кэВ; сумма 1112,08 кэВ СОВПАДАЕТ с прямой линией 1112,076 -- см. примечание выше; score=3,82"}
  - {e1_kev: 244.697, e2_kev: 121.782, nuclide: Eu152, i1_pct: 7.55, i2_pct: 28.53, note: "уровень 121,782 кэВ; сумма 366,48 кэВ, score=3,50"}
  - {e1_kev: 411.116, e2_kev: 344.279, nuclide: Eu152, i1_pct: 2.237, i2_pct: 26.59, note: "уровень 344,279 кэВ; сумма 755,40 кэВ, score=2,15"}
  - {e1_kev: 1089.737, e2_kev: 344.279, nuclide: Eu152, i1_pct: 1.734, i2_pct: 26.59, note: "уровень 344,279 кэВ; сумма 1434,02 кэВ, score=1,67 -- у порога, но CC полный"}
  - {e1_kev: 1299.142, e2_kev: 344.279, nuclide: Eu152, i1_pct: 1.633, i2_pct: 26.59, note: "уровень 344,279 кэВ; сумма 1643,42 кэВ (вне диапазона подгонки e_hi_kev=1500 -- запись только для истощения линий 1299,142 и 344,279), score=1,57"}

geant4:
  gps_region:
    centre_mm: [0, 0, 16]
    radius_mm: 90
    halfz_mm: 60
    confine_volume: Sample
  isotope_runs:
    - {key: Am241, z: 95, a: 241, n_events: 1000000, out_file: iso_Am241.csv}
    - {key: Ti44chain, z: 22, a: 44, z_min: 20, z_max: 22, n_events: 1000000, out_file: iso_Ti44chain.csv}
    - {key: Cs137chain, z: 56, a: 137, excitation_keV: 661.659, n_events: 500000, out_file: iso_Cs137chain.csv}
    - {key: Eu152, z: 63, a: 152, n_events: 2000000, out_file: iso_Eu152.csv}
