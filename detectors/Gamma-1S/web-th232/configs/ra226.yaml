# Конфиг источника Ra-226 для конвейера Гамма-1С (Пилот 1, задача #175/#182).
#
# ПЕРЕХОД 10.08.2026: источник -19 (поверка 2024) занесён оператором в
# чёрный список ("странный файл с дефектом", ra226-remarks.md §14) --
# конвейер переведён на -18 (поверка 2016). ЭТО ДРУГОЙ физический
# источник: матрица ОИСН-06 (ро=0,60, насыпная эпоксидка, гипотеза
# оператора) вместо ОИСН-16 (ро=1,60) у -19/-19-2016. Сетка МЕТОДА 2
# (grid/rho1.60_E*.csv) для ЭТОЙ матрицы НЕ годится -- geant4/gps_region
# ниже (габариты сосуда) не поменялся, но плотность и состав среды другие
# -- нужна СВОЯ сетка grid/OISN06_epoxy0.60_E*.csv (drivers/run_grid.py
# OISN06_epoxy 0.60, geometry/G1SDetector.cc матрица "OISN06_epoxy",
# состав -- ra226-remarks.md §15, sci-search 10.08.2026: расчёт брутто-
# формулы эпоксидка+ПЭПА-аналог, C 70,98% H 7,77% N 4,80% O 16,45%).
# Метод 1 (МК-шаблоны по нуклидам) -- см. geant4.isotope_runs ниже, тот же
# прогон под новую матрицу (macros/decay_ra226_isotopes.mac не менялся,
# состав задаётся CLI-аргументом g1s.exe, не макросом).
#
# Библиотека линий (library.lines) и пары суммирования (sum_peaks) --
# ПРЕДВАРИТЕЛЬНЫЕ (09.08.2026): взяты из IAEA Live Chart of Nuclides
# (nds.iaea.org/relnsd/v1/data, fields=decay_rads, rad_types=g), curl
# напрямую -- НЕ прошли независимую перекрёстную проверку LNHB/DDEP,
# которую в своё время получила библиотека Th-232 (2% отбор + LNHB на
# каждой линии). Отбор SUM_PEAKS -- по порогу score=I1*I2/F_B>=1.5
# (tools/enumerate_sum_peaks.py), физика (каскад через уровень 609,318 кэВ
# Bi-214 -- учебный пример TCS в гамма-спектрометрии, Gilmore) правдоподобна,
# но формально это уровень проверки 📗, не ✅.

source:
  id: ra226
  measured_format: lsrm_spe   # НЕ becqmoni xml -- см. пояснение ниже
  # Заглушка: export_data.py.XML_MEAS строится безусловно на верхнем
  # уровне модуля (используется только внутри main(), которую quicklook-
  # скрипт не вызывает) -- ключ обязан существовать, значение не читается.
  measured_xml_rel: "N/A_lsrm_spe_used_instead"
  # Источник -18, поверка 2016 (переход 10.08.2026 с забракованного -19,
  # см. ra226-remarks.md §14 -- прочитано напрямую из .spe, ✅).
  measured_sample_spe_rel: raw_lsrm/Work/BG/Gamma-1S/Spe - поверки/Поверка 2016/Маринелли/Ra226_420-7-18_Маринелли_0cm.spe
  # Фон "вода", индекс _14 (50400 с) -- та же геометрия, прибор совпадает
  # (серийный номер не публикуется), тот же выбор индекса, что у прежнего
  # фона -19 (эквивалентность
  # проверена по live-time, см. SESSION-STATE.md).
  measured_background_spe_env: G4MODELS_RA226_BG_SPE
  chain_template_csv: chain_Ra226.csv   # перегенерируется прогоном под OISN06_epoxy

passport:
  bq_per_kg: 1780.0
  unc_pct: 6.0
  mass_g: 620.0
  passport_date: "2002-05-24"
  measured_date: "2016-05-19"
  half_life_years: 1600.0   # IAEA Live Chart (226Ra decay_rads), unc ±7 лет
  days_pass_to_meas: 5109

nuclides:
  - key: Ra226
    label_ru: Ra-226
    label_en: Ra-226
    color: "#7a1f6b"
    br: 1.0
    note_ru: "α; γ 186,2 кэВ (3,57%) -- единственная значимая линия родителя"
  - key: Rn222
    label_ru: Rn-222
    label_en: Rn-222
    color: "#2c6e8a"
    br: 1.0
    note_ru: "α; γ практически отсутствуют (макс. известная линия 510 кэВ, 0,076%)"
  - key: Po218
    label_ru: Po-218
    label_en: Po-218
    color: "#8a5a2c"
    br: 1.0
    note_ru: "α (99,98%); γ нет вовсе -- IAEA Live Chart не даёt ни одной линии"
  - key: Pb214
    label_ru: Pb-214
    label_en: Pb-214
    color: "#1f7a4c"
    br: 1.0
    note_ru: "β⁻; γ 351,9 / 295,2 / 242,0 кэВ -- доминирует в мягкой части"
  - key: Bi214
    label_ru: Bi-214
    label_en: Bi-214
    color: "#c23b22"
    br: 1.0
    note_ru: "β⁻ (99,98%); γ 609,3 / 1764,5 / 1120,3 / 1238,1 / 2204,1 / 768,4 / 1377,7 / 934,1 / 1729,6 кэВ -- весь жёсткий край, богатейший каскад цепочки"
  - key: Po214
    label_ru: Po-214
    label_en: Po-214
    color: "#6b6b1f"
    br: 1.0
    note_ru: "α (T½=164 мкс); γ пренебрежимо (макс. 0,01%)"

fit:
  e_lo_kev: 100.0
  e_hi_kev: 2300.0

library:
  intensity_threshold_pct: 2.0
  lines:
    - {e_kev: 186.211, i_pct: 3.565,  nuclide: Ra226, note: "единственная линия родителя выше порога"}
    - {e_kev: 351.932, i_pct: 35.724, nuclide: Pb214, note: "главная линия Pb-214"}
    - {e_kev: 295.224, i_pct: 18.471, nuclide: Pb214, note: ""}
    - {e_kev: 241.995, i_pct: 7.263,  nuclide: Pb214, note: "+ суммирование 241.995+53.226 (ниже фильтра библиотеки)"}
    - {e_kev: 609.321, i_pct: 45.440, nuclide: Bi214, note: "главная линия ветви; истощается совпадением сильнее всех (учебный пример TCS)"}
    - {e_kev: 1764.491, i_pct: 15.290, nuclide: Bi214, note: ""}
    - {e_kev: 1120.294, i_pct: 14.900, nuclide: Bi214, note: "+ суммирование в 609.321"}
    - {e_kev: 1238.122, i_pct: 5.830,  nuclide: Bi214, note: "+ суммирование в 609.321"}
    - {e_kev: 2204.100, i_pct: 4.920,  nuclide: Bi214, note: ""}
    - {e_kev: 768.360,  i_pct: 4.890,  nuclide: Bi214, note: "+ суммирование в 609.321"}
    - {e_kev: 1377.669, i_pct: 3.985,  nuclide: Bi214, note: ""}
    - {e_kev: 934.056,  i_pct: 3.094,  nuclide: Bi214, note: "+ суммирование в 609.321"}
    - {e_kev: 1729.595, i_pct: 2.870,  nuclide: Bi214, note: "суммарная линия 1120,294+609,321 накладывается на прямую"}

sum_peaks:
  # Отбор: score=I1*I2/F_B >= 1.5 (tools/enumerate_sum_peaks.py на полной
  # библиотеке data/ensdf_ra226_chain_lines.csv). Доминирует каскад через
  # уровень 609,318 кэВ Bi-214 (F_B практически = I(609,321) -- почти вся
  # депопуляция уровня идёт этой одной линией).
  - {e1_kev: 1120.294, e2_kev: 609.321, nuclide: Bi214, i1_pct: 14.900, i2_pct: 45.440, note: "уровень 609,318 кэВ; крупнейший каскад цепочки"}
  # Пара 241.995+53.226 (Pb214, уровень 53,226 кэВ) была ОТКЛОНЕНА
  # (09.08.2026 днём): F_B по гамма-линиям = 1,074% < входящей 241.995
  # (7,263%) -- физически невозможно для чистой гамма-депопуляции, страж
  # export_data.py._sum_peaks_with_fb это поймал.
  #
  # ⚠️ ПЕРЕСМОТРЕТЬ (09.08.2026 вечером, аудит Б4, #2): вывод «страж поймал
  # корректно» был неверным толкованием -- страж поймал СИМПТОМ ТОГО ЖЕ
  # бага, что и Б1 (F_B без учёта внутренней конверсии), не физическую
  # невозможность пары. С CC для Pb214 (data/conversion_coeff_sum_peak_
  # levels.csv, tools/fetch_conversion_coeff.py, NUCLIDES расширен) F_B =
  # 14,17% >= 7,263% -- противоречие снято, пара физически состоятельна.
  # НЕ включена в SUM_PEAKS автоматически (score=0,55, у самого порога
  # 0,5; 53,226 кэВ ниже фильтра библиотеки -- см. note выше) -- решение
  # оставлено оператору, не принято этой правкой.
  - {e1_kev: 1238.122, e2_kev: 609.321, nuclide: Bi214, i1_pct: 5.830,  i2_pct: 45.440, note: "уровень 609,318 кэВ"}
  - {e1_kev: 768.360,  e2_kev: 609.321, nuclide: Bi214, i1_pct: 4.890,  i2_pct: 45.440, note: "уровень 609,318 кэВ"}
  - {e1_kev: 934.056,  e2_kev: 609.321, nuclide: Bi214, i1_pct: 3.094,  i2_pct: 45.440, note: "уровень 609,318 кэВ"}
  - {e1_kev: 1407.988, e2_kev: 609.321, nuclide: Bi214, i1_pct: 2.388,  i2_pct: 45.440, note: "уровень 609,318 кэВ; 1407,988 ниже порога библиотеки"}
  - {e1_kev: 1509.211, e2_kev: 609.321, nuclide: Bi214, i1_pct: 2.127,  i2_pct: 45.440, note: "уровень 609,318 кэВ; 1509,211 ниже порога библиотеки"}
  - {e1_kev: 1155.210, e2_kev: 609.321, nuclide: Bi214, i1_pct: 1.634,  i2_pct: 45.440, note: "уровень 609,318 кэВ; 1155,210 ниже порога библиотеки"}

# ── Метод 1: МК-шаблоны по нуклидам (10.08.2026, оператор дал добро на
# полный прогон) ────────────────────────────────────────────────────────
# gps_region -- ТА ЖЕ геометрия, что у Th-232 (тот же сосуд/матрица/
# детектор, значения скопированы из configs/th232.yaml дословно).
# n_events по аналогии с ролью нуклида в цепочке Th-232 (R66: слабой
# гамма-ветви нужны статистикой на порядки больше):
#   Ra226 (единственная линия 3,57%, α-родитель) -- как Th232 (3 млн)
#   Rn222 (гамма практически нет, макс. известная 0,076%) -- как Rn220 (3 млн)
#   Po218/Po214 (гамма нет/пренебрежимо) -- как Ac228/Pb212/Tl208 (200 тыс)
#   Pb214 (умеренные линии 7-36%) -- как Pb212 (200 тыс)
#   Bi214 (богатейший каскад, самая слабая нужная линия 2,87%) -- как Bi212 (2 млн)
geant4:
  gps_region:
    centre_mm: [0, 0, 16]
    radius_mm: 90
    halfz_mm: 60
    confine_volume: Sample
  isotope_runs:
    - {key: Ra226, z: 88, a: 226, n_events: 3000000, out_file: iso_Ra226.csv}
    - {key: Rn222, z: 86, a: 222, n_events: 3000000, out_file: iso_Rn222.csv}
    - {key: Po218, z: 84, a: 218, n_events: 200000,  out_file: iso_Po218.csv}
    - {key: Pb214, z: 82, a: 214, n_events: 200000,  out_file: iso_Pb214.csv}
    - {key: Bi214, z: 83, a: 214, n_events: 2000000, out_file: iso_Bi214.csv}
    - {key: Po214, z: 84, a: 214, n_events: 200000,  out_file: iso_Po214.csv}
