# Конфиг источника Th-232 для конвейера Гамма-1С.
# Сгенерирован из export_data.py (этап 2, задача #175/#177,
# 09.08.2026) -- НЕ переписан руками, транскрипционных ошибок нет.
# sum_peaks: пары найдены вручную (перекрёстная проверка ENSDF/LNHB,
# см. export_data.py._sum_peaks_with_fb) -- это заведомо ручной шаг
# (категория C инвентаризации, задача #176), не результат перебора.
#
# geant4.isotope_runs (этап 3, задача #175): значения n_events -- слияние
# decay_th232_isotopes.mac (базовый набор, 200000 на нуклид) и
# decay_th232_isotopes_hi.mac (добор статистики R66 для Th232/Rn220/
# Th228/Bi212/Ra224 -- см. историю коммитов macros/ до этапа 3). Раньше
# это были ДВА файла, второй молча перезаписывал вывод первого для пяти
# из восьми нуклидов; теперь одно число на нуклид, один генерируемый
# макрос (tools/generate_isotope_macro.py), коллизия невозможна структурно.
# GPS-регион (gps_region) -- та же проба, что и во ВСЕХ прогонах ветви
# (macros/decay_all.mac, coinc_th232.mac и др. вне области этого этапа,
# трогать не стал -- общая инфраструктура с другими потребителями,
# нуклидами Cs-137/K-40, не только Th-232).

